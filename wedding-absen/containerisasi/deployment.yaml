apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-absen
  labels:
    app: wedding-absen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wedding-absen
  template:
    metadata:
      labels:
        app: wedding-absen
    spec:
      containers:
      - name: wedding-absen
        image: wedding-absen:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wedding-absen-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: wedding-absen
